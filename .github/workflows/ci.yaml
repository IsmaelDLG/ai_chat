name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones antiguas de la misma rama/PR cuando subes un commit nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (format + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Valores ficticios: los tests no deben depender de Ollama ni de secretos reales
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost:5432
      DB_NAME: ai_chat
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: not-needed
      LLM_MODEL: test-model
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --if-present: no falla si todavía no tienes ese script en package.json
      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test --if-present

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo comprueba que la imagen construye; todavía no se publica
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}